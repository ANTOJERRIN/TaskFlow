services:
  - type: web
    name: taskflow
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && npm ci --include=dev && npm run build
    startCommand: flask --app backend.app init-db && gunicorn --bind "0.0.0.0:$PORT" --workers 1 --threads 4 'backend.app:create_app()'
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString

databases:
  - name: taskflow-db
    databaseName: taskflow
    plan: free
    region: singapore
    ipAllowList: []
